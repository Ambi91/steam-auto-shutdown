# Builds Auto Shutdown for Steam for Windows, macOS and Linux.
#
# How to run:
#   * manually: Actions → Build → Run workflow
#   * automatically: by pushing a v* tag (e.g. v1.0.0) – this also creates
#     a GitHub Release with all three files to download
name: Build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos
          - os: ubuntu-22.04   # older glibc = the binary runs on more distributions
            platform: linux
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('build-{0}', github.run_number) }}
    steps:
      - uses: actions/checkout@v4

      # Python from uv (python-build-standalone) has tkinter on every system
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.0"

      - name: Prepare Python
        shell: bash
        run: |
          uv venv --python 3.12 .venv
          uv pip install --python .venv pyinstaller==6.22.3

      - name: Build
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then PY=.venv/Scripts/python; else PY=.venv/bin/python; fi
          $PY -c "import tkinter; print('tkinter', tkinter.TkVersion)"
          $PY -m PyInstaller --noconfirm --clean SteamAutoShutdown.spec

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/SteamAutoShutdown.exe -DestinationPath "SteamAutoShutdown-windows-$env:VERSION.zip"
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent "dist/Auto Shutdown for Steam.app" "SteamAutoShutdown-macos-$VERSION.zip"
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: tar -czf "SteamAutoShutdown-linux-$VERSION.tar.gz" -C dist SteamAutoShutdown

      # Microsoft Store package. It is not signed here: the Store signs it on upload,
      # so it can't be installed by double-click and is kept out of the GitHub Release.
      - name: Package MSIX for the Microsoft Store (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME || 'SteamAutoShutdown' }}
          PUBLISHER: ${{ vars.MSIX_PUBLISHER || 'CN=SteamAutoShutdown' }}
          PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME || 'Jan Ambrož' }}
          DISPLAY_NAME: ${{ vars.MSIX_DISPLAY_NAME || 'Auto Shutdown for Steam' }}
        run: |
          $sdk = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\10.*" -Directory |
                 Sort-Object { [version]$_.Name } | Select-Object -Last 1
          $bin = Join-Path $sdk.FullName "x64"
          # The Store needs a numeric version a.b.c.0 – taken from a tag like v1.2.3.
          $v = $env:VERSION -replace '^v', ''
          if ($v -notmatch '^\d+\.\d+\.\d+$') { $v = "0.0.$env:GITHUB_RUN_NUMBER" }
          $env:VERSION_MSIX = "$v.0"

          New-Item -ItemType Directory msix | Out-Null
          Copy-Item dist/SteamAutoShutdown.exe msix/
          Copy-Item -Recurse packaging/msix/Assets msix/Assets
          $manifest = Get-Content packaging/msix/AppxManifest.xml -Raw
          foreach ($k in 'IDENTITY_NAME', 'PUBLISHER', 'PUBLISHER_DISPLAY_NAME', 'DISPLAY_NAME') {
            $val = [Security.SecurityElement]::Escape((Get-Item "env:$k").Value)
            $manifest = $manifest.Replace('${' + $k + '}', $val)
          }
          $manifest = $manifest.Replace('${VERSION}', $env:VERSION_MSIX)
          Set-Content msix/AppxManifest.xml $manifest -Encoding utf8

          & "$bin\makepri.exe" createconfig /cf priconfig.xml /dq en-US /pv 10.0.0 /o
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & "$bin\makepri.exe" new /pr msix /cf priconfig.xml /mn msix/AppxManifest.xml /of msix/resources.pri /o
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & "$bin\makeappx.exe" pack /d msix /p "MicrosoftStore-$env:VERSION_MSIX.msix" /o
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: SteamAutoShutdown-${{ matrix.platform }}
          path: SteamAutoShutdown-${{ matrix.platform }}-*
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: MicrosoftStore-msix
          path: MicrosoftStore-*.msix

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: SteamAutoShutdown-*   # not the Store package
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
