# Builds Steam Auto-Shutdown for Windows, macOS and Linux.
#
# How to run:
#   * manually: Actions → Build → Run workflow
#   * automatically: by pushing a v* tag (e.g. v1.0.0) – this also creates
#     a GitHub Release with all three files to download
name: Build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos
          - os: ubuntu-22.04   # older glibc = the binary runs on more distributions
            platform: linux
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('build-{0}', github.run_number) }}
    steps:
      - uses: actions/checkout@v4

      # Python from uv (python-build-standalone) has tkinter on every system
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.0"

      - name: Prepare Python
        shell: bash
        run: |
          uv venv --python 3.12 .venv
          uv pip install --python .venv pyinstaller==6.22.3

      - name: Build
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then PY=.venv/Scripts/python; else PY=.venv/bin/python; fi
          $PY -c "import tkinter; print('tkinter', tkinter.TkVersion)"
          $PY -m PyInstaller --noconfirm --clean SteamAutoShutdown.spec

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/SteamAutoShutdown.exe -DestinationPath "SteamAutoShutdown-windows-$env:VERSION.zip"
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent "dist/Steam Auto-Shutdown.app" "SteamAutoShutdown-macos-$VERSION.zip"
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: tar -czf "SteamAutoShutdown-linux-$VERSION.tar.gz" -C dist SteamAutoShutdown

      - uses: actions/upload-artifact@v4
        with:
          name: SteamAutoShutdown-${{ matrix.platform }}
          path: SteamAutoShutdown-${{ matrix.platform }}-*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
