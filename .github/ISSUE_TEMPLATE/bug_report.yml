name: Report a problem
description: Something doesn't work as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! English or Czech is fine.
        No GitHub account? Email jan.ambroz.91@gmail.com instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start watching
        2. Pause the download in Steam
        3. ...
  - type: input
    id: environment
    attributes:
      label: System
      description: Filled in automatically when you open this form from the app.
      placeholder: e.g. Windows 11, x64, Microsoft Store
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Screenshots, which games were downloading, Steam library on another drive, etc.
